name: Build Android APK

# Builds a debug APK and publishes it as a downloadable artifact.
#
# `verify` and `build-apk` are deliberately separate, independent jobs: the APK
# must still be produced when a browser-based check is flaky, and the checks
# still report their own status.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, browser-free checks. Runs in parallel with the APK build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check native sources
        run: npm run verify:native

      - name: Typecheck
        run: npm run typecheck

      - name: Verify data layer
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify UI behaviour
        run: npm run verify:ui

      - name: Verify mobile layout and diff contrast
        run: npm run verify:layout

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK, so it is used directly
      # instead of `android-actions/setup-android`.
      #
      # That action runs `sdkmanager tools`, but the `tools` package has been
      # removed from the SDK repository, so the action aborts with
      # "Failed to find package 'tools'" (exit code 1) before any project step
      # runs. Installing only the packages this project actually needs avoids
      # that entirely.
      - name: Set up Android SDK
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

          # `sdkmanager` is not on PATH on this image, and cmdline-tools lives
          # under a version directory (for example cmdline-tools/16.0) rather
          # than being symlinked as `latest`. Resolve it by globbing instead of
          # assuming a path, so a layout change cannot break this step.
          SDKMANAGER=""
          for candidate in \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager \
            "$(command -v sdkmanager 2>/dev/null || true)"
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"

            # Accepting licences exits non-zero once everything is accepted,
            # which is not an error here.
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

            # Capacitor 6 compiles against compileSdk 34 / build-tools 34.0.0.
            # A non-zero result is tolerated because the image may already ship
            # these; the directory checks below are the real gate.
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
              || echo "WARNING: sdkmanager install did not complete cleanly"
          else
            echo "WARNING: sdkmanager not found; using the preinstalled SDK as-is"
          fi

          # Print the real layout so any later failure here is diagnosable from
          # the log alone.
          echo "--- SDK root contents ---"
          ls -1 "${ANDROID_HOME}" || true
          echo "--- platforms: $(ls -1 "${ANDROID_HOME}/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "--- build-tools: $(ls -1 "${ANDROID_HOME}/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "--- cmdline-tools: $(ls -1 "${ANDROID_HOME}/cmdline-tools" 2>/dev/null | tr '\n' ' ')"

          # Fail here rather than deep inside Gradle if the platform Capacitor 6
          # targets is genuinely absent.
          test -d "${ANDROID_HOME}/platforms/android-34" \
            || { echo "ERROR: Android platform 34 is missing from the SDK"; exit 1; }

      - name: Install dependencies
        run: npm ci

      # Fails in a second instead of after a full Gradle run: a missing Java
      # import cannot be caught locally without the Android SDK.
      - name: Check native sources
        run: npm run verify:native

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # The native sources are kept in the repo so the Android bridge is
      # reproducible without a generated Android project being checked in.
      #
      # MainActivity must be replaced, not merely added: Capacitor only
      # auto-discovers plugins listed in assets/capacitor.plugins.json, which is
      # generated for plugin *modules*, not for a plugin living in the app. The
      # generated MainActivity therefore has to register SafPlugin explicitly or
      # the `Saf` bridge is missing in the APK.
      - name: Install native Android sources
        run: |
          set -euo pipefail
          PKG=android/app/src/main/java/com/dsh/apkevaluator
          mkdir -p "$PKG"
          cp android-plugin/SafPlugin.java "$PKG/SafPlugin.java"
          cp android-plugin/MainActivity.java "$PKG/MainActivity.java"
          echo "--- installed native sources ---"
          ls -la "$PKG"
          echo "--- verifying plugin registration ---"
          grep -q "registerPlugin(SafPlugin.class)" "$PKG/MainActivity.java"
          echo "OK: MainActivity registers SafPlugin"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check APK contents
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

          echo "--- verifying the SAF plugin class reached the dex ---"
          unzip -p "$APK" 'classes*.dex' | strings | grep -q "SafPlugin" \
            && echo "OK: SafPlugin present in dex" \
            || { echo "ERROR: SafPlugin missing from dex"; exit 1; }

          echo "--- verifying web assets were bundled ---"
          unzip -l "$APK" | grep -q "assets/public/index.html" \
            && echo "OK: web assets bundled" \
            || { echo "ERROR: web assets missing"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dataset-cleaner-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
